# AWS-Specific Resource Mapping
# Detailed AWS implementation of the universal infrastructure composer

cloud_provider: aws
provider_full_name: "Amazon Web Services"
region: "us-east-1"
account_id: "<AWS_ACCOUNT_ID>"

# AWS Service Mapping
aws_services:
  
  # 1. Networking (Amazon VPC)
  networking:
    vpc:
      service: "Amazon VPC"
      resource_type: "aws_vpc"
      properties:
        cidr_block: "10.0.0.0/16"
        enable_dns_hostnames: true
        enable_dns_support: true
      terraform_resource: "aws_vpc.main"
      console_url: "https://console.aws.amazon.com/vpc"
      pricing: "FREE (no charge for VPC)"
    
    private_subnets:
      service: "Amazon VPC"
      resource_type: "aws_subnet"
      count: 2
      properties:
        cidr_blocks: ["10.0.1.0/24", "10.0.2.0/24"]
        availability_zones: ["us-east-1a", "us-east-1b"]
        map_public_ip_on_launch: false
      terraform_resource: "aws_subnet.private[*]"
      pricing: "FREE (included with VPC)"
    
    route_table:
      service: "Amazon VPC"
      resource_type: "aws_route_table"
      properties:
        vpc_id: "reference:vpc"
      terraform_resource: "aws_route_table.private"
      pricing: "FREE (included with VPC)"
    
    route_table_association:
      service: "Amazon VPC"
      resource_type: "aws_route_table_association"
      count: 2
      terraform_resource: "aws_route_table_association.private[*]"
      pricing: "FREE"
    
    security_group:
      service: "Amazon VPC"
      resource_type: "aws_security_group"
      properties:
        name: "lambda-security-group"
        vpc_id: "reference:vpc"
        egress_rules:
          - protocol: "tcp"
            from_port: 443
            to_port: 443
            cidr_blocks: ["0.0.0.0/0"]
            description: "HTTPS to S3 via Gateway Endpoint"
          - protocol: "tcp"
            from_port: 22
            to_port: 22
            cidr_blocks: ["0.0.0.0/0"]
            description: "SSH/SFTP to legacy server"
      terraform_resource: "aws_security_group.lambda"
      pricing: "FREE"
    
    s3_vpc_endpoint:
      service: "Amazon VPC Endpoints"
      resource_type: "aws_vpc_endpoint"
      properties:
        vpc_id: "reference:vpc"
        service_name: "com.amazonaws.us-east-1.s3"
        vpc_endpoint_type: "Gateway"
        route_table_ids: ["reference:route_table"]
      terraform_resource: "aws_vpc_endpoint.s3"
      pricing: "FREE (no hourly charge, no data transfer charge)"
      documentation: "https://docs.aws.amazon.com/vpc/latest/privatelink/vpc-endpoints-s3.html"
    
    vpc_endpoint_policy:
      service: "Amazon VPC Endpoints"
      resource_type: "aws_vpc_endpoint_policy"
      properties:
        vpc_endpoint_id: "reference:s3_vpc_endpoint"
        policy: "least_privilege_s3_access"
      terraform_resource: "aws_vpc_endpoint_policy.s3"
      pricing: "FREE"

  # 2. Compute (AWS Lambda)
  compute:
    lambda_function:
      service: "AWS Lambda"
      resource_type: "aws_lambda_function"
      properties:
        function_name: "secure-file-transfer-function"
        runtime: "python3.11"
        handler: "lambda_function.lambda_handler"
        memory_size: 512
        timeout: 300
        vpc_config:
          subnet_ids: "reference:private_subnets"
          security_group_ids: ["reference:security_group"]
        environment_variables:
          S3_BUCKET_NAME: "reference:s3_bucket"
          SFTP_SECRET_ARN: "reference:secrets_manager_secret"
          SFTP_REMOTE_PATH: "/sftp/files"
          LOG_LEVEL: "INFO"
      terraform_resource: "aws_lambda_function.file_transfer"
      pricing:
        compute: "$0.0000166667 per GB-second"
        requests: "$0.20 per 1M requests"
        estimated_monthly: "$0.25 for 1000 executions"
      documentation: "https://docs.aws.amazon.com/lambda/"
    
    lambda_permission:
      service: "AWS Lambda"
      resource_type: "aws_lambda_permission"
      properties:
        statement_id: "AllowExecutionFromEventBridge"
        action: "lambda:InvokeFunction"
        function_name: "reference:lambda_function"
        principal: "events.amazonaws.com"
        source_arn: "reference:eventbridge_rule"
      terraform_resource: "aws_lambda_permission.eventbridge"
      pricing: "FREE"

  # 3. Storage (Amazon S3)
  storage:
    s3_bucket:
      service: "Amazon S3"
      resource_type: "aws_s3_bucket"
      properties:
        bucket_prefix: "secure-file-transfer-"
      terraform_resource: "aws_s3_bucket.file_transfer"
      pricing:
        standard: "$0.023 per GB/month"
        standard_ia: "$0.0125 per GB/month (after 30 days)"
        glacier_ir: "$0.004 per GB/month (after 90 days)"
        deep_archive: "$0.00099 per GB/month (after 180 days)"
      documentation: "https://aws.amazon.com/s3/pricing/"
    
    s3_versioning:
      service: "Amazon S3"
      resource_type: "aws_s3_bucket_versioning"
      properties:
        bucket: "reference:s3_bucket"
        status: "Enabled"
      terraform_resource: "aws_s3_bucket_versioning.file_transfer"
      pricing: "Standard S3 pricing for all versions"
    
    s3_encryption:
      service: "Amazon S3"
      resource_type: "aws_s3_bucket_server_side_encryption_configuration"
      properties:
        bucket: "reference:s3_bucket"
        algorithm: "AES256"
        bucket_key_enabled: true
      terraform_resource: "aws_s3_bucket_server_side_encryption_configuration.file_transfer"
      pricing: "FREE (SSE-S3), or $0.01 per 10,000 requests (SSE-KMS with bucket keys)"
    
    s3_public_access_block:
      service: "Amazon S3"
      resource_type: "aws_s3_bucket_public_access_block"
      properties:
        bucket: "reference:s3_bucket"
        block_public_acls: true
        block_public_policy: true
        ignore_public_acls: true
        restrict_public_buckets: true
      terraform_resource: "aws_s3_bucket_public_access_block.file_transfer"
      pricing: "FREE"
    
    s3_lifecycle:
      service: "Amazon S3"
      resource_type: "aws_s3_bucket_lifecycle_configuration"
      properties:
        bucket: "reference:s3_bucket"
        rules:
          - id: "transition-to-ia"
            status: "Enabled"
            transitions:
              - days: 30
                storage_class: "STANDARD_IA"
              - days: 90
                storage_class: "GLACIER_IR"
              - days: 180
                storage_class: "DEEP_ARCHIVE"
          - id: "delete-old-versions"
            status: "Enabled"
            noncurrent_version_expiration:
              days: 90
      terraform_resource: "aws_s3_bucket_lifecycle_configuration.file_transfer"
      pricing: "FREE (lifecycle rules), pay for storage in each class"

  # 4. IAM (Identity and Access Management)
  iam:
    lambda_role:
      service: "AWS IAM"
      resource_type: "aws_iam_role"
      properties:
        name: "lambda-file-transfer-role"
        assume_role_policy:
          service: "lambda.amazonaws.com"
      terraform_resource: "aws_iam_role.lambda"
      pricing: "FREE"
    
    lambda_s3_policy:
      service: "AWS IAM"
      resource_type: "aws_iam_role_policy"
      properties:
        role: "reference:lambda_role"
        name: "lambda-s3-access"
        permissions:
          - "s3:PutObject"
          - "s3:PutObjectAcl"
          - "s3:GetObject"
          - "s3:ListBucket"
        resource:
          - "arn:aws:s3:::bucket-name"
          - "arn:aws:s3:::bucket-name/*"
      terraform_resource: "aws_iam_role_policy.lambda_s3"
      pricing: "FREE"
    
    lambda_logs_policy:
      service: "AWS IAM"
      resource_type: "aws_iam_role_policy_attachment"
      properties:
        role: "reference:lambda_role"
        policy_arn: "arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole"
      terraform_resource: "aws_iam_role_policy_attachment.lambda_logs"
      pricing: "FREE"
    
    lambda_vpc_policy:
      service: "AWS IAM"
      resource_type: "aws_iam_role_policy_attachment"
      properties:
        role: "reference:lambda_role"
        policy_arn: "arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole"
      terraform_resource: "aws_iam_role_policy_attachment.lambda_vpc"
      pricing: "FREE"
    
    lambda_secrets_policy:
      service: "AWS IAM"
      resource_type: "aws_iam_role_policy"
      properties:
        role: "reference:lambda_role"
        name: "lambda-secrets-access"
        permissions:
          - "secretsmanager:GetSecretValue"
        resource: "reference:secrets_manager_secret"
      terraform_resource: "aws_iam_role_policy.lambda_secrets"
      pricing: "FREE"

  # 5. Secrets Management
  secrets:
    secrets_manager_secret:
      service: "AWS Secrets Manager"
      resource_type: "aws_secretsmanager_secret"
      properties:
        name: "sftp-credentials"
        description: "SFTP server credentials"
      terraform_resource: "aws_secretsmanager_secret.sftp_credentials"
      pricing: "$0.40 per secret per month"
      documentation: "https://aws.amazon.com/secrets-manager/pricing/"
    
    secrets_manager_version:
      service: "AWS Secrets Manager"
      resource_type: "aws_secretsmanager_secret_version"
      properties:
        secret_id: "reference:secrets_manager_secret"
        secret_string:
          username: "sftp_user"
          password: "encrypted_password"
          host: "sftp.example.com"
          port: 22
      terraform_resource: "aws_secretsmanager_secret_version.sftp_credentials"
      pricing: "Included in secret cost"

  # 6. Monitoring and Logging
  monitoring:
    cloudwatch_log_group:
      service: "Amazon CloudWatch Logs"
      resource_type: "aws_cloudwatch_log_group"
      properties:
        name: "/aws/lambda/secure-file-transfer-function"
        retention_in_days: 7
      terraform_resource: "aws_cloudwatch_log_group.lambda"
      pricing:
        ingestion: "$0.50 per GB"
        storage: "$0.03 per GB/month"
        estimated_monthly: "$0.05 for 1 GB logs"
      documentation: "https://aws.amazon.com/cloudwatch/pricing/"
    
    cloudwatch_alarms:
      service: "Amazon CloudWatch"
      resource_type: "aws_cloudwatch_metric_alarm"
      properties:
        alarm_name: "lambda-errors-alarm"
        metric_name: "Errors"
        namespace: "AWS/Lambda"
        comparison_operator: "GreaterThanThreshold"
        threshold: 5
      pricing: "$0.10 per alarm per month"

  # 7. Automation
  automation:
    eventbridge_rule:
      service: "Amazon EventBridge"
      resource_type: "aws_cloudwatch_event_rule"
      properties:
        name: "file-transfer-schedule"
        schedule_expression: "cron(0 2 * * ? *)"
        is_enabled: true
      terraform_resource: "aws_cloudwatch_event_rule.file_transfer_schedule"
      pricing: "FREE for scheduled rules"
    
    eventbridge_target:
      service: "Amazon EventBridge"
      resource_type: "aws_cloudwatch_event_target"
      properties:
        rule: "reference:eventbridge_rule"
        arn: "reference:lambda_function"
      terraform_resource: "aws_cloudwatch_event_target.lambda"
      pricing: "FREE"

# Total AWS Infrastructure Cost Estimate
cost_estimate:
  monthly:
    lambda_compute: "$0.25"
    lambda_requests: "Included"
    s3_storage_100gb: "$2.30"
    s3_requests: "$0.01"
    secrets_manager: "$0.40"
    cloudwatch_logs: "$0.05"
    vpc: "$0.00"
    s3_gateway_endpoint: "$0.00"
    cloudwatch_alarms: "$0.10"
    total: "$3.11/month"
  
  annual:
    estimated: "$37.32/year"
  
  savings:
    nat_gateway_avoided: "$32.40/month ($388.80/year)"
    total_savings_vs_nat: "91% cost reduction"

# AWS-Specific Best Practices
best_practices:
  - "Use S3 Gateway Endpoint instead of NAT Gateway for cost savings"
  - "Enable S3 bucket versioning for data protection"
  - "Use lifecycle policies to transition data to cheaper storage classes"
  - "Enable bucket key encryption to reduce KMS costs by 99%"
  - "Set CloudWatch log retention to minimum required (7 days for dev)"
  - "Use IAM roles instead of access keys"
  - "Enable VPC Flow Logs for security monitoring (optional)"
  - "Tag all resources for cost allocation and governance"
  - "Use AWS Config for compliance monitoring (optional)"
  - "Enable AWS CloudTrail for audit logging (optional)"

# Deployment Commands
deployment:
  terraform:
    init: "terraform init"
    plan: "terraform plan -out=tfplan"
    apply: "terraform apply tfplan"
    destroy: "terraform destroy"
  
  aws_cli:
    package_lambda: "cd lambda && zip -r ../lambda_function.zip . -x '*.pyc' -x '__pycache__/*'"
    update_lambda: "aws lambda update-function-code --function-name secure-file-transfer-function --zip-file fileb://lambda_function.zip"
    invoke_lambda: "aws lambda invoke --function-name secure-file-transfer-function output.json"
    view_logs: "aws logs tail /aws/lambda/secure-file-transfer-function --follow"

# Monitoring and Observability
monitoring_queries:
  cloudwatch_insights:
    error_analysis: |
      fields @timestamp, @message
      | filter @message like /ERROR/
      | sort @timestamp desc
      | limit 100
    
    performance_stats: |
      fields @timestamp, @duration, @memorySize / 1000000 as memoryUsedMB
      | stats avg(@duration), max(@duration), avg(memoryUsedMB), max(memoryUsedMB) by bin(5m)
    
    file_transfer_success: |
      fields @timestamp, @message
      | filter @message like /File transferred successfully/
      | count()

# Security Checklist
security:
  network:
    - "✓ Lambda in private subnets"
    - "✓ S3 Gateway Endpoint for private connectivity"
    - "✓ Security group allows only required outbound traffic"
    - "✓ No internet gateway attached to private subnets for S3 traffic"
  
  data:
    - "✓ S3 bucket encryption enabled (AES256)"
    - "✓ S3 versioning enabled"
    - "✓ Public access blocked on S3 bucket"
    - "✓ TLS/HTTPS for all data in transit"
  
  identity:
    - "✓ IAM role with least privilege permissions"
    - "✓ No hardcoded credentials in code"
    - "✓ Secrets stored in Secrets Manager"
    - "✓ VPC endpoint policy restricts S3 access"
  
  monitoring:
    - "✓ CloudWatch Logs enabled for Lambda"
    - "✓ CloudWatch Alarms for error detection"
    - "✓ Log retention policy configured"
